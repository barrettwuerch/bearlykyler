<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metallic button</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--paper:#fcfdfd;--ink:#29343c}.metallic { position: relative; isolation: isolate; overflow: hidden; border: 0px; padding: 0px; border-radius: 10px; background: none; box-shadow: rgba(0, 0, 0, 0.16) 0px 8px 22px; cursor: pointer; }.metallic::before { content: ""; position: absolute; inset: 0px; z-index: 0; border-radius: inherit; background: linear-gradient(105deg, rgb(17, 17, 17) 0%, rgb(115, 115, 115) 14%, rgb(250, 250, 250) 26%, rgb(82, 82, 82) 38%, rgb(10, 10, 10) 50%, rgb(163, 163, 163) 64%, rgb(255, 255, 255) 75%, rgb(64, 64, 64) 87%, rgb(17, 17, 17) 100%) 0% 0% / 230% 100%; animation: 8s ease-in-out 0s infinite normal none running metal-drift; }.metallic-sheen { position: absolute; top: 0px; bottom: 0px; left: -58%; width: 52%; z-index: 1; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55) 48%, transparent); opacity: 0.55; filter: blur(3px); mix-blend-mode: screen; transform: skewX(-12deg); transition: transform 2.4s ease-in-out; }.metallic:hover .metallic-sheen, .metallic:focus-visible .metallic-sheen { transform: translateX(330%) skewX(-12deg); }.metallic-face { position: relative; z-index: 2; display: block; margin: 2px; padding: 12px 20px; border-radius: 8px; background: var(--paper); color: var(--ink); font: 700 13px Nunito, Arial, sans-serif; box-shadow: rgba(255, 255, 255, 0.28) 0px 1px 0px inset, rgba(0, 0, 0, 0.16) 0px -1px 0px inset; transition: background 0.2s, transform 0.12s; }.metallic:hover .metallic-face { background: rgb(241, 239, 233); }.metallic:active .metallic-face { transform: scale(0.985); }@keyframes metal-drift { 
  0%, 100% { background-position: 0px 50%; }
  50% { background-position: 26% 50%; }
}@media (prefers-reduced-motion: reduce){.metallic::before { animation: auto ease 0s 1 normal none running none; }.metallic-sheen { display: none; }}</style></head><body><button class="metallic" id="metallic-demo" type="button"><span class="metallic-sheen" aria-hidden="true"></span><span class="metallic-face">Get in touch</span></button><script></script></body></html>
