<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accordion expand</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--amber:#2274ad;--muted:#59677b;--ink:#29343c;--line:#dce5ec}.t-acc { --acc-expand: 250ms; --acc-collapse: 250ms; --acc-chevron: 250ms; --acc-ease: cubic-bezier(.22,1,.36,1); }.t-acc-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--acc-collapse) var(--acc-ease); }.t-acc[data-open="true"] .t-acc-panel { grid-template-rows: 1fr; transition: grid-template-rows var(--acc-expand) var(--acc-ease); }.t-acc-panel-inner { overflow: hidden; opacity: 0; filter: blur(2px); transition: opacity var(--acc-collapse) var(--acc-ease),filter var(--acc-collapse) var(--acc-ease); }.t-acc[data-open="true"] .t-acc-panel-inner { opacity: 1; filter: blur(0px); transition: opacity var(--acc-expand) var(--acc-ease),filter var(--acc-expand) var(--acc-ease); }.t-acc-chevron { display: inline-flex; transform: scaleY(1); transform-origin: center center; transition: transform var(--acc-chevron) var(--acc-ease); }.t-acc-chevron path { vector-effect: non-scaling-stroke; }.t-acc[data-open="true"] .t-acc-chevron { transform: scaleY(-1); }.acc-demo { display: flex; flex-direction: column; gap: 8px; width: 252px; }.t-acc { border-radius: 12px; background: rgb(255, 255, 255); box-shadow: rgba(41, 52, 60, 0.08) 0px 0px 0px 1px inset; }.t-acc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 11px 14px; border: 0px; background: none; font: 700 13px Nunito, Arial, sans-serif; color: var(--ink); text-align: left; cursor: pointer; }.t-acc-head:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; border-radius: 12px; }.t-acc-chevron svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }.t-acc-panel-inner p { margin: 0px; padding: 0px 14px 13px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }@media (prefers-reduced-motion: reduce){.t-acc-panel, .t-acc-panel-inner, .t-acc-chevron { transition: none !important; }}</style></head><body><div class="acc-demo" id="acc-demo"><div class="t-acc" data-open="true"><button class="t-acc-head" type="button" aria-expanded="true">What is it?<span class="t-acc-chevron"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5L8 10.5L12 6.5"></path></svg></span></button><div class="t-acc-panel"><div class="t-acc-panel-inner"><p>A disclosure that animates its own height — no measuring, no fixed values.</p></div></div></div><div class="t-acc" data-open="false"><button class="t-acc-head" type="button" aria-expanded="false">How does it open?<span class="t-acc-chevron"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5L8 10.5L12 6.5"></path></svg></span></button><div class="t-acc-panel"><div class="t-acc-panel-inner"><p>The panel is a grid whose single row goes from 0fr to 1fr.</p></div></div></div><div class="t-acc" data-open="false"><button class="t-acc-head" type="button" aria-expanded="false">And the chevron?<span class="t-acc-chevron"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5L8 10.5L12 6.5"></path></svg></span></button><div class="t-acc-panel"><div class="t-acc-panel-inner"><p>It flips on scaleY, passing through a flat line at the midpoint.</p></div></div></div></div><script>function wireAcc(root){const items=[...root.querySelectorAll('.t-acc')];
 const set=(item,open)=>{item.dataset.open=String(open);
  item.querySelector('.t-acc-head').setAttribute('aria-expanded',String(open))};
 for(const item of items)item.querySelector('.t-acc-head').addEventListener('click',()=>{
  const open=item.dataset.open!=='true';
  // One at a time: three open panels are taller than the card preview, and
  // this is what people expect an accordion to do anyway.
  for(const other of items)if(other!==item)set(other,false);
  set(item,open)})};wireAcc(document.querySelector('.acc-demo'));</script></body></html>
