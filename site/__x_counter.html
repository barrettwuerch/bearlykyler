<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Count up</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--ink:#29343c;--muted:#59677b}.counter { display: flex; gap: 38px; }.counter-stat { text-align: center; }.counter-value { display: block; font-style: normal; font-variant: tabular-nums; font-size-adjust: none; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: 900; font-stretch: normal; font-size: 34px; font-family: Nunito, Arial, sans-serif; color: var(--ink); line-height: 1.1; }.counter-label { display: block; margin-top: 5px; font: 10px monospace; letter-spacing: 1.5px; color: var(--muted); }</style></head><body><div class="counter" id="counter-demo"><span class="counter-stat"><span class="counter-value" data-count="1500" data-suffix="ms">1,500ms</span><span class="counter-label">WAVE LENGTH</span></span><span class="counter-stat"><span class="counter-value" data-count="13">13</span><span class="counter-label">COMPONENTS</span></span><span class="counter-stat"><span class="counter-value" data-count="100" data-suffix="%">100%</span><span class="counter-label">VANILLA</span></span></div><script>function wireCount(root){const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 for(const el of root.querySelectorAll('.counter-value')){
  const target=+el.dataset.count,suffix=el.dataset.suffix||'',duration=+el.dataset.duration||1400;
  const paint=n=>{el.textContent=n.toLocaleString()+suffix};
  if(reduced.matches){paint(target);continue}
  // The authored markup already carries the final number, so a page with no
  // scripting shows the real figure rather than a zero.
  paint(0);
  const run=startedAt=>{const step=now=>{const progress=Math.min((now-startedAt)/duration,1);
    paint(Math.round(target*(1-Math.pow(1-progress,3))));
    if(progress<1)requestAnimationFrame(step)};requestAnimationFrame(step)};
  const watch=new IntersectionObserver(entries=>{if(entries[0].isIntersecting){watch.disconnect();run(performance.now())}},{threshold:.5});
  watch.observe(el);
 }
};wireCount(document.querySelector('.counter'));</script></body></html>
