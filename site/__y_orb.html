<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal orb</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--muted:#59677b;--ink:#29343c;--line:#dce5ec;--amber:#2274ad}.orb { display: flex; flex-direction: column; align-items: center; gap: 10px; }.orb canvas { display: block; }.orb-state { font: 10px monospace; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }.orb-controls { display: flex; gap: 6px; }.orb-controls button { border: 1px solid var(--line); border-radius: 999px; background: rgb(255, 255, 255); padding: 5px 11px; font: 600 11px Nunito, Arial, sans-serif; color: var(--muted); cursor: pointer; transition: color 0.15s, border-color 0.15s; }.orb-controls button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }.orbs { display: flex; flex-direction: column; align-items: center; gap: 14px; }.orbs-pill { display: inline-flex; align-items: center; gap: 9px; padding: 7px 18px 7px 8px; border-radius: 999px; background: rgb(255, 255, 255); white-space: nowrap; box-shadow: rgba(41, 52, 60, 0.04) 0px 1px 1px, rgba(41, 52, 60, 0.07) 0px 4px 12px, rgba(41, 52, 60, 0.07) 0px 0px 0px 1px inset; }.orbs-canvas { display: block; }.orbs-pill b { font: 700 13.5px Nunito, Arial, sans-serif; letter-spacing: -0.1px; color: var(--ink); }.orbs-dots { display: inline-block; width: 1.7em; font-style: normal; font-weight: 700; color: var(--muted); text-align: left; font-variant-numeric: tabular-nums; }.orbs-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }.orbs-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 250px; }.orbs-controls button { border: 1px solid var(--line); border-radius: 999px; background: rgb(255, 255, 255); padding: 6px 12px; font: 600 11.5px Nunito, Arial, sans-serif; color: var(--muted); cursor: pointer; transition: color 0.15s, border-color 0.15s; }.orbs-controls button:hover { color: var(--ink); }.orbs-controls button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }@media (max-width: 760px){.orbs-controls button { min-height: 44px; padding: 0px 14px; }}</style></head><body><div class="orb" id="orb-demo"><canvas width="150" height="150" aria-hidden="true"></canvas><span class="orb-state" role="status" aria-live="polite">Idle</span><div class="orb-controls"><button type="button" data-orb="idle" aria-pressed="true">Idle</button><button type="button" data-orb="listening" aria-pressed="false">Listening</button><button type="button" data-orb="thinking" aria-pressed="false">Thinking</button></div></div><script>function wireOrb(root){const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),readout=root.querySelector('.orb-state');
 const tabs=[...root.querySelectorAll('[data-orb]')];
 const size=canvas.width,dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=canvas.height=Math.round(size*dpr);canvas.style.width=canvas.style.height=size+'px';
 // Scale by buffer/size rather than by dpr, so the transform stays exact when
 // the buffer rounds.
 ctx.scale(canvas.width/size,canvas.height/size);
 ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--amber').trim()||'#2274ad';
 const GRID=11,half=(GRID-1)/2,gap=size*.74/(GRID-1),rmax=gap*.6,mid=size/2;
 const REST={idle:.86,listening:1,thinking:.93};
 const weights={idle:1,listening:0,thinking:0};
 let mode='idle',scale=REST.idle,vel=0,clock=0,last=0,frame=0;

 // Two slow waves multiplied: neither crosses zero, so the level never snaps
 // at a trough the way a rectified sine does.
 const level=t=>.24+.76*(.45+.55*(.5+.5*Math.sin(t*.64+.4)))*(.5+.5*Math.sin(t*1.87+1.1));
 const heat=(state,d,nx,ny,t,amp)=>{
  if(state==='listening')return .3+amp*(.34+.4*(.5+.5*Math.sin(d*4.6-t*3.1)));
  if(state==='thinking'){let sum=0;
   for(const o of [[.6,2.1,0,.42],[.38,-1.6,2.2,.35],[.8,1.1,4.1,.33]]){
    const a=t*o[1]+o[2],dx=nx-Math.cos(a)*o[0],dy=ny-Math.sin(a)*o[0];
    sum+=Math.exp(-(dx*dx+dy*dy)/(o[3]*o[3]))}
   return .25+.8*Math.min(1,sum)}
  return .6+.13*Math.sin(t*1.05-d*2.3)};

 function draw(t,amp,s){ctx.clearRect(0,0,size,size);
  for(let iy=0;iy<GRID;iy++)for(let ix=0;ix<GRID;ix++){
   const nx=(ix-half)/half,ny=(iy-half)/half,d=Math.hypot(nx,ny);
   // 1.12 rather than the square's 1.41 corner is what rounds the silhouette.
   if(d>1.12)continue;
   let v=0;for(const k in weights)if(weights[k]>=.001)v+=weights[k]*heat(k,d,nx,ny,t,amp);
   const r=rmax*Math.exp(-d*d*1.7)*Math.min(1,Math.max(0,v))*s;
   // Under half a device pixel a dot renders as haze rather than a dot.
   if(r*dpr<.5)continue;
   ctx.beginPath();ctx.arc(mid+(ix-half)*gap*s,mid+(iy-half)*gap*s,r,0,Math.PI*2);ctx.fill()}}

 function tick(now){const dt=Math.min((now-(last||now))/1000,.05);last=now;clock+=dt;
  // Per-state weights, so interrupting a change blends from what is on screen
  // rather than restarting.
  const blend=1-Math.pow(1-.16,dt*60);
  for(const k in weights)weights[k]+=((k===mode?1:0)-weights[k])*blend;
  vel+=(-180*(scale-REST[mode])-26*vel)*dt;scale+=vel*dt;
  draw(clock,level(clock),scale);frame=requestAnimationFrame(tick)}

 function still(){cancelAnimationFrame(frame);frame=0;
  for(const k in weights)weights[k]=k===mode?1:0;draw(0,level(0),REST[mode])}
 function sync(){if(reduced.matches||document.hidden){still();return}if(!frame){last=0;frame=requestAnimationFrame(tick)}}
 for(const tab of tabs)tab.addEventListener('click',()=>{mode=tab.dataset.orb;
  tabs.forEach(t=>t.setAttribute('aria-pressed',String(t===tab)));
  readout.textContent=tab.textContent;sync()});
 document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);
 new IntersectionObserver(e=>{e[0].isIntersecting?sync():(cancelAnimationFrame(frame),frame=0)},{threshold:.15}).observe(root);
 sync();
};wireOrb(document.querySelector('.orb'));</script></body></html>
