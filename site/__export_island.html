<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status island</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--line:#dce5ec;--muted:#59677b;--ink:#29343c}.island { display: flex; flex-direction: column; align-items: center; gap: 14px; }.island-shell { position: relative; display: flex; justify-content: center; align-items: flex-start; width: 126px; height: 37px; overflow: hidden; border-radius: 32px; background: rgb(20, 19, 15); color: rgb(250, 249, 246); box-shadow: rgba(0, 0, 0, 0.34) 0px 16px 34px; transition: width 0.62s cubic-bezier(0.32, 0.72, 0, 1), height 0.62s cubic-bezier(0.32, 0.72, 0, 1); }.island-sizer { position: relative; width: max-content; }.island-slot { display: flex; align-items: center; justify-content: center; gap: 9px; transform-origin: center top; white-space: nowrap; font: 600 12px Nunito, Arial, sans-serif; }.island-slot[hidden] { display: none; }.island-slot[data-view="pill"] { min-width: 126px; min-height: 37px; padding: 0px 16px; }.island-slot:not([data-view="pill"]) { padding: 15px 22px; }.island-dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(183, 118, 55); flex: 0 0 auto; }.island-slot.enter { animation: 0.5s cubic-bezier(0.32, 0.72, 0, 1) 0s 1 normal none running island-in; }.island-slot.leaving { opacity: 0; transform: scale(0.92) translateY(-6px); transition: opacity 0.08s ease-out, transform 0.08s ease-out; }@keyframes island-in { 
  0% { opacity: 0; transform: scale(0.9) translateY(-8px); filter: blur(5px); }
  100% { opacity: 1; transform: none; filter: blur(0px); }
}.island-controls { display: flex; gap: 6px; }.island-controls button { border: 1px solid var(--line); border-radius: 999px; background: rgb(255, 255, 255); padding: 5px 11px; font: 600 11px Nunito, Arial, sans-serif; color: var(--muted); cursor: pointer; transition: color 0.15s, border-color 0.15s; }.island-controls button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }@media (prefers-reduced-motion: reduce){.island-shell { transition: none; }.island-slot.enter { animation: auto ease 0s 1 normal none running none; }.island-slot.leaving { transition: none; }}</style></head><body><div class="island" id="island-demo"><div class="island-shell" role="status" aria-live="polite"><div class="island-sizer"><div class="island-slot" data-view="pill"><span class="island-dot" aria-hidden="true"></span>Bearly</div><div class="island-slot" data-view="honey" hidden="">Honey jar refilled · 2 min ago</div><div class="island-slot" data-view="wave" hidden="">Now playing<br>The 1.5&nbsp;second wave</div></div></div><div class="island-controls"><button type="button" data-island-view="pill" aria-pressed="true">Pill</button><button type="button" data-island-view="honey" aria-pressed="false">Honey</button><button type="button" data-island-view="wave" aria-pressed="false">Wave</button></div></div><script>function wireIsland(root){const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const shell=root.querySelector('.island-shell'),sizer=root.querySelector('.island-sizer');
 const slots=[...sizer.querySelectorAll('.island-slot')],tabs=[...root.querySelectorAll('[data-island-view]')];
 let current=slots.find(s=>!s.hidden)||slots[0],timer=0;
 // The shell owns explicit dimensions and springs toward the natural size of
 // whatever slot is showing, so the slot is never scale-distorted.
 const fit=()=>{shell.style.width=sizer.offsetWidth+'px';shell.style.height=sizer.offsetHeight+'px'};
 function show(next){if(!next||next===current)return;clearTimeout(timer);
  const swap=()=>{current.classList.remove('leaving');current.hidden=true;next.hidden=false;current=next;
   next.classList.remove('enter');void next.offsetWidth;if(!reduced.matches)next.classList.add('enter');fit()};
  if(reduced.matches){swap();return}
  current.classList.add('leaving');timer=setTimeout(swap,80);
 }
 for(const tab of tabs)tab.addEventListener('click',()=>{tabs.forEach(t=>t.setAttribute('aria-pressed',String(t===tab)));
  show(slots.find(s=>s.dataset.view===tab.dataset.islandView))});
 new ResizeObserver(fit).observe(sizer);fit();
};wireIsland(document.querySelector('.island'));</script></body></html>
