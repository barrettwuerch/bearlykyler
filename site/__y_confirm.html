<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete, then mean it</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--muted:#59677b;--ink:#29343c;--line:#dce5ec;--amber:#2274ad;--sky:#e6f5ff}.confirm { position: relative; display: flex; align-items: center; width: 48px; height: 48px; border-radius: 16px; background: rgb(255, 255, 255); color: var(--muted); box-shadow: rgba(41, 52, 60, 0.06) 0px 1px 2px, rgba(41, 52, 60, 0.07) 0px 0px 0px 1px inset; transition: width 0.62s cubic-bezier(0.32, 0.72, 0, 1); }.confirm.open { width: 134px; }.confirm-trigger { position: relative; z-index: 2; flex: 0 0 auto; display: grid; place-items: center; width: 48px; height: 48px; border: 0px; border-radius: 16px; background: none; color: inherit; cursor: pointer; }.confirm-trigger:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }.confirm-lid { transform-box: view-box; transform-origin: 3px 6px; transition: transform 0.6s cubic-bezier(0.34, 1.1, 0.64, 1); }.confirm.open .confirm-lid { transform: rotate(-38deg); }.confirm-bin { transition: opacity 0.22s, transform 0.45s cubic-bezier(0.32, 0.72, 0, 1); }.confirm-tick { position: absolute; opacity: 0; transform: scale(0.6); transition: opacity 0.22s, transform 0.22s cubic-bezier(0.32, 0.72, 0, 1); color: var(--amber); }.confirm.done .confirm-bin { opacity: 0; }.confirm.done .confirm-tick { opacity: 1; transform: none; }.confirm.kept .confirm-bin { transform: scale(0.88); }.confirm-panel { position: absolute; top: 0px; bottom: 0px; right: 0px; display: flex; align-items: center; justify-content: center; gap: 9px; width: 86px; border-radius: 16px; background: rgb(230, 235, 241); box-shadow: rgba(41, 52, 60, 0.09) 0px 1px 2px inset; opacity: 0; transform: translateX(-6px); pointer-events: none; transition: opacity 0.3s cubic-bezier(0.32, 0.72, 0, 1), transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); }.confirm.open .confirm-panel { opacity: 1; transform: none; pointer-events: auto; transition-delay: 0.14s; }.confirm-circle { display: grid; place-items: center; width: 28px; height: 28px; border: 0px; border-radius: 50%; background: rgb(255, 255, 255); color: var(--muted); cursor: pointer; box-shadow: rgba(41, 52, 60, 0.06) 0px 0.5px 1px, rgba(41, 52, 60, 0.1) 0px 1.5px 4px; transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), box-shadow 0.2s; }.confirm-circle:hover { transform: scale(1.06); }.confirm-circle:active { transform: scale(0.84); }.confirm-circle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }.confirm-circle[data-confirm] { color: var(--amber); }@media (prefers-reduced-motion: reduce){.confirm, .confirm-lid, .confirm-panel, .confirm-bin, .confirm-tick, .confirm-circle, .odo-reel { transition: none; }}.scramble-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}</style></head><body><div class="confirm" id="confirm-demo"><button class="confirm-trigger" type="button" aria-label="Delete" aria-expanded="false"><svg class="confirm-bin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><g class="confirm-lid"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></g></svg><svg class="confirm-tick" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 7"></path></svg></button><div class="confirm-panel"><button class="confirm-circle" type="button" data-confirm="" aria-label="Confirm delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 7"></path></svg></button><button class="confirm-circle" type="button" data-cancel="" aria-label="Cancel"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"></path></svg></button></div><span class="scramble-sr" role="status" aria-live="polite"></span></div><script>function wireConfirm(root){const trigger=root.querySelector('.confirm-trigger'),status=root.querySelector('[role=status]');
 let hold=0;
 const finish=(mark,ms,word)=>{clearTimeout(hold);
  root.classList.remove('open');trigger.setAttribute('aria-expanded','false');
  root.classList.add(mark);status.textContent=word;trigger.focus();
  hold=setTimeout(()=>{root.classList.remove(mark);status.textContent=''},ms)};
 trigger.addEventListener('click',()=>{
  if(root.classList.contains('open')){finish('kept',600,'Kept');return}
  clearTimeout(hold);root.classList.remove('done','kept');status.textContent='';
  root.classList.add('open');trigger.setAttribute('aria-expanded','true')});
 root.querySelector('[data-confirm]').addEventListener('click',()=>finish('done',1400,'Deleted'));
 root.querySelector('[data-cancel]').addEventListener('click',()=>finish('kept',600,'Kept'));
 // Escape is how people expect to back out of a confirmation.
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.classList.contains('open')){e.stopPropagation();finish('kept',600,'Kept')}});
};wireConfirm(document.querySelector('.confirm'));</script></body></html>
