<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marquee</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}body{display:block!important;padding:40px 0}:root{--muted:#59677b;--amber:#2274ad}.marquee { position: relative; display: flex; width: 100%; min-width: 0px; contain: inline-size; overflow: hidden; mask-image: linear-gradient(90deg, transparent, rgb(0, 0, 0) 11%, rgb(0, 0, 0) 89%, transparent); }.marquee-track { display: flex; flex: 0 0 auto; align-items: center; gap: 30px; padding-right: 30px; animation: 19s linear 0s infinite normal none running marquee-run; }.marquee:hover .marquee-track, .marquee:focus-within .marquee-track { animation-play-state: paused; }.marquee-item { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; font: 700 14px Nunito, Arial, sans-serif; color: var(--muted); }.marquee-item::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: 0 0 auto; }@keyframes marquee-run { 
  100% { transform: translateX(-100%); }
}@media (prefers-reduced-motion: reduce){.marquee-track { animation: auto ease 0s 1 normal none running none; }}</style></head><body><div class="marquee" id="marquee-demo"><div class="marquee-track"><span class="marquee-item">Design</span><span class="marquee-item">Code</span><span class="marquee-item">Motion</span><span class="marquee-item">Honey</span><span class="marquee-item">Bears</span><span class="marquee-item">Curiosity</span></div></div><script>function wireMarquee(root){const track=root.querySelector('.marquee-track');
 // A second copy closes the loop: both travel one track width and restart
 // together, so there is never a gap to see.
 const copy=track.cloneNode(true);copy.setAttribute('aria-hidden','true');root.append(copy);
};wireMarquee(document.querySelector('.marquee'));</script></body></html>
