<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expandable action bar</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfdfd;font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #2274ad;outline-offset:5px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}*{box-sizing:border-box}:root{--line:#dce5ec;--muted:#59677b;--ink:#29343c;--amber:#2274ad}.action-bar { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.95); box-shadow: rgba(41, 40, 35, 0.1) 0px 10px 30px; }.action-bar button { position: relative; z-index: 1; display: inline-flex; align-items: center; height: 34px; padding: 0px 10px; border: 0px; border-radius: 999px; background: none; color: var(--muted); font: 600 13px Nunito, Arial, sans-serif; cursor: pointer; transition: color 0.15s; }.action-bar button:hover, .action-bar button:focus-visible { color: var(--ink); }.action-bar button[aria-pressed="true"] { color: var(--amber); }.ab-icon { display: inline-flex; flex: 0 0 auto; width: 18px; justify-content: center; font-size: 15px; }.ab-label { display: inline-block; max-width: 0px; margin-left: 0px; overflow: hidden; white-space: nowrap; opacity: 0; filter: blur(3px); transition: max-width 0.34s cubic-bezier(0.32, 0.72, 0, 1), margin-left 0.34s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s, filter 0.22s; }.action-bar.open .ab-label { max-width: 11ch; margin-left: 7px; opacity: 1; filter: blur(0px); }.ab-glow { position: absolute; left: 0px; top: 6px; z-index: 0; height: 34px; width: 0px; border-radius: 999px; background: rgba(183, 118, 55, 0.13); opacity: 0; pointer-events: none; transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), width 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s; }@media (prefers-reduced-motion: reduce){.ab-label { filter: none; transition: none; }.ab-glow { transition: opacity 0.2s; }}</style></head><body><div class="action-bar" id="action-bar-demo" role="group" aria-label="Post actions"><button type="button" aria-pressed="true"><span class="ab-icon" aria-hidden="true">●︎</span><span class="ab-label">Like</span></button><button type="button" aria-pressed="false"><span class="ab-icon" aria-hidden="true">◍︎</span><span class="ab-label">Comment</span></button><button type="button" aria-pressed="false"><span class="ab-icon" aria-hidden="true">↗︎</span><span class="ab-label">Share</span></button><button type="button" aria-pressed="false"><span class="ab-icon" aria-hidden="true">☆︎</span><span class="ab-label">Save</span></button></div><script>function wireActionBar(bar){const reduced=matchMedia('(prefers-reduced-motion: reduce)');const buttons=[...bar.querySelectorAll('button')];
 const glow=document.createElement('span');glow.className='ab-glow';glow.setAttribute('aria-hidden','true');bar.prepend(glow);
 let timer=0,armed=false,lastType='mouse',wasOpen=false;
 const open=()=>{clearTimeout(timer);bar.classList.add('open')};
 const lift=()=>{glow.style.opacity='0'};
 const close=()=>{clearTimeout(timer);timer=setTimeout(()=>{bar.classList.remove('open');armed=false;lift()},90)};
 const move=b=>{glow.style.width=b.offsetWidth+'px';glow.style.transform='translateX('+b.offsetLeft+'px)';glow.style.opacity='1'};
 const select=b=>buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
 // Pointer events rather than mouseenter/mouseleave: a tap fires compatibility
 // mouse events carrying no pointerType, and the bar growing under a still
 // finger fired the leave before the click landed — one tap opened, closed and
 // ran nothing.
 bar.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')open()});
 bar.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'){lift();close()}});
 bar.addEventListener('focusin',open);
 bar.addEventListener('focusout',e=>{if(!bar.contains(e.relatedTarget))close()});
 for(const b of buttons){
  b.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch'){clearTimeout(timer);move(b)}});
  b.addEventListener('focus',()=>{open();move(b)});
  b.addEventListener('pointerdown',e=>{lastType=e.pointerType;wasOpen=bar.classList.contains('open')});
  // Nothing reveals the labels to a finger, so the first tap opens the bar and
  // the next one acts. Read from the state at pointerdown: a browser that
  // focuses the button on contact opens the bar mid-tap, and that first tap
  // would otherwise fire the action it was meant to reveal.
  b.addEventListener('click',()=>{
   if(lastType!=='mouse'&&!wasOpen&&!armed){armed=true;open();move(b);return}
   select(b);move(b);
  });
 }
 // A finger never hovers, so a bar a tap opened has nothing to close it.
 document.addEventListener('pointerdown',e=>{if(armed&&!bar.contains(e.target))close()});
 reduced.addEventListener('change',()=>{if(reduced.matches)lift()});
};wireActionBar(document.querySelector('.action-bar'));</script></body></html>
